# Builds the Windows installer, which can't be built on a Mac. Not signed yet, so Windows warns on opening.
name: Focus.MD Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - app/focus-md.html
      - .github/workflows/windows.yml

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python build.py
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: focus-md-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
